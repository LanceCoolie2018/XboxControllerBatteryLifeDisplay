# Maintenance Monkey — BatteryHUD
# https://github.com/LanceCoolie2018/maintenance-monkey

[project]
name = "BatteryHUD"
default_branch = "master"

[watch.logs]
# FileLog writes repo-root/logs/batteryhud.log (also under bin/ when cwd differs)
paths = [
  "logs/**/*.log",
  "bin/**/logs/**/*.log",
]
from_start = false

[watch.process]
# App is a GUI — run it yourself on the laptop; monkey only tails logs + UserReport
enabled = false
restart_on_exit = false
incident_on_crash = true

[watch.user_report]
enabled = true
path = "UserReport.md"
debounce_seconds = 2
# On the Pi: pull latest AssIsstant branch before scanning (laptop edits via push)
pull_before_scan = true
auto_check_on_pr = true
# How often daemon pulls origin (seconds) so laptop pushes are seen without local edits
remote_poll_seconds = 30
# Never work these (teacher jokes / nonsense)
ignore = [
  '(?i)monkey.*voice',
  '(?i)doesn.?t have a voice',
]

# Customer Store/source reports filed as GitHub Issues (label customer-report).
# Maintainer host only — requires `gh auth login`. App never embeds tokens.
#
# Lifecycle:
#   open customer-report → Grok fixes on AssIsstant → label mm-ready-for-review
#   (issue STAYS OPEN for Ready-for-Review) → you commit "task complete" → close
# False report:  python -m maintenance_monkey github-issues dismiss 19
#   or add GitHub label: invalid | wontfix | false-report | mm-dismissed
[watch.github_issues]
enabled = true
repo = "LanceCoolie2018/XboxControllerBatteryLifeDisplay"
labels = ["customer-report"]
state = "open"
poll_seconds = 60
mark_ready_on_done = true
ready_label = "mm-ready-for-review"
dismiss_labels = ["invalid", "wontfix", "false-report", "mm-dismissed"]
close_on_task_complete = true
# Do not close when Grok finishes — wait for your task complete review
auto_close_on_done = false

[patterns]
include = [
  '(?i)exception',
  '(?i)traceback \\(most recent call last\\)',
  'Unhandled exception',
  '(?i)fatal error',
  'NullReferenceException',
  'InvalidOperationException',
  'ArgumentNullException',
  '(?i)\\[ERROR\\]',
]
exclude = [
  '(?i)healthcheck failed.*retrying',
]

[known_bugs]
path = "known_bugs.yaml"
match_logs = true

[dispatch]
grok_bin = "/home/lance/.grok/bin/grok"
max_turns = 80
max_concurrent_jobs = 1
cooldown_seconds = 300
worktree_parent = ".."
# All fixes on this one branch (no AssIsstant-fix-* clutter)
work_branch = "AssIsstant"
push = true
# One PR AssIsstant → master; each job adds a comment
create_pr = true
dry_run = false
job_timeout_seconds = 3600
rules = """
Work only in this worktree. Commit with a clear message.
All work is pushed to the AssIsstant branch only — no extra branches.
Never checkout or push main/master. Never force-push.
Do not modify secrets, credentials, or .mm/state.
Prefer minimal diffs. Run existing tests if available.
Do not merge to master. Do not delete other UserReport checklist items.
This is an Avalonia/.NET 8 BatteryHUD overlay app.
"""

[hooks]
install_pre_push = true
install_post_commit = false

[notify]
on_job_start = true
on_pr_created = true
